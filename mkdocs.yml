site_name: Documentación de seguimiento de medios

theme:
  name: dracula

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            filters: []

nav:
  - Inicio: index.md
  - Known Issues: known-issues.md
  - Módulos:
      - Backend: modules/api.md
      - ASR (Transcripción): modules/asr.md
      - LLM: modules/llm.md
      - Análisis de sentimiento: modules/nlp.md
      - Servicios: modules/services.md
      - Pipeline: modules/pipeline.md
      - Configuración: modules/config.md
      - Ingesta de datos: modules/data-ingestion.md
      - Utilidades: modules/utils.md