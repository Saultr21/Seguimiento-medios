[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seguimiento-medios"
version = "0.1.0"
description = "Pipeline de scraping + ASR + chatbot para análisis de sentimiento por términos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
start-server = "app:run"